name: Publicar instalador Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tag SemVer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "El tag $env:GITHUB_REF_NAME no coincide con package.json ($packageVersion)."
          }

      - name: Compilar y publicar instalador
        if: github.event_name == 'push'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar instalador para carga inicial a R2
        if: github.event_name == 'workflow_dispatch'
        run: npm run build -- --publish never

      - name: Exigir configuración R2 en carga manual
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:R2_PUBLIC_BASE_URL)) {
            throw "Configura primero las variables y secretos de R2 indicados en README.md."
          }

      - name: Copiar instalador a Cloudflare R2
        if: ${{ vars.R2_PUBLIC_BASE_URL != '' }}
        run: node scripts/upload-release-to-r2.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
